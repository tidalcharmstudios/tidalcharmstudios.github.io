<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
    
    <!-- Anti-AI & Machine Learning Scraping Safeguards -->
    <meta name="robots" content="noai, noimageai">
    <meta name="googlebot" content="noai, noimageai">
    <meta name="tdm-reservation" content="1">

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Global Header -->
    <header class="site-header">
        <div class="header-placeholder">
            <svg viewBox="0 0 800 200" preserveAspectRatio="none" class="placeholder-svg">
                <rect width="100%" height="100%" fill="#113e72"/>
                <text x="50%" y="50%" fill="#95dfed" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="22">
                    Header Graphic Placeholder (SVG / SVG Banner)
                </text>
            </svg>
        </div>
        <h1 class="site-title">{{ site.title }}</h1>
        <p class="site-tagline">{{ site.tagline }}</p>
    </header>

    <!-- Page Specific Content Injected Here -->
    {{ content }}

    <!-- Zero-Tracking Direct Contact Section -->
    <section class="contact-section">
        <h2>Initiate Contact</h2>
        <p>Direct email connection for inquiries, fine art acquisition, and dialogue.</p>
        
        <a href="mailto:tidalcharmstudios@gmail.com?subject=Studio%20Inquiry%20-%20Tidal%20Charm%20Studios&body=Hello%20Megan,%0A%0AI%20am%20reaching%20out%20regarding:" class="contact-button">
            Send Direct Email
        </a>
    </section>

    <!-- Global Footer -->
    <footer class="site-footer">
        <div class="footer-placeholder">
            <svg viewBox="0 0 800 100" preserveAspectRatio="none" class="placeholder-svg">
                <rect width="100%" height="100%" fill="#113e72"/>
                <text x="50%" y="50%" fill="#c4a35a" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="16">
                    Footer Accent Graphic Placeholder (SVG)
                </text>
            </svg>
        </div>
        <p class="copyright">&copy; 2026 {{ site.title }}. All Rights Reserved. Synthetic-Free Imagery.</p>
    </footer>

</body>
</html>
