<!-- Global Header Component with Star Emblem -->
<header class="site-header">
    <div class="header-emblem">
        <!-- SVG Compass / Star Emblem -->
        <svg viewBox="0 0 100 100" width="60" height="60" fill="none" stroke="#b6d0e2" stroke-width="1.5">
            <circle cx="50" cy="50" r="30" stroke="#113e72" stroke-width="1" />
            <!-- 4-Point Star Core -->
            <path d="M 50 10 Q 50 50 90 50 Q 50 50 50 90 Q 50 50 10 50 Q 50 50 50 10 Z" fill="#95dfed" fill-opacity="0.15" stroke="#95dfed" stroke-width="1.5"/>
            <line x1="50" y1="5" x2="50" y2="95" stroke="#c4a35a" stroke-width="1"/>
            <line x1="5" y1="50" x2="95" y2="50" stroke="#c4a35a" stroke-width="1"/>
        </svg>
    </div>
    
    <h1 class="site-title">
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    </h1>
    
    <p class="site-tagline">{{ site.tagline }}</p>
</header>
